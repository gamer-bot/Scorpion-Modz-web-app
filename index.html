<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORPION MODZ · DEV EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* matured developer palette — deep indigo, cool grey, electric blue, subtle amber */
    :root {
      --depth-50: #f5f7ff;
      --depth-100: #e9ecf5;
      --depth-200: #cfd6e6;
      --depth-300: #a9b3cc;
      --depth-400: #7b86a3;
      --depth-500: #5a637d;
      --depth-600: #3f475f;
      --depth-700: #2a3145;
      --depth-800: #1a1f2d;
      --depth-900: #0e121b;
      --accent-primary: #3980fa;        /* clean electric blue */
      --accent-secondary: #0f2b4f;
      --accent-tertiary: #1f4a8f;
      --success: #10b981;                /* calm green */
      --warning: #f59e0b;                /* warm orange */
      --danger: #ef4444;                  /* soft red */
      --glow-highlight: rgba(57, 128, 250, 0.25);
      --border-subtle: rgba(57, 128, 250, 0.15);
      --card-bg: rgba(20, 25, 38, 0.9);
      --glass-bg: rgba(26, 31, 45, 0.7);
      --text-primary: #edf2fc;
      --text-secondary: #a9b9d4;
      --text-muted: #7e8aa8;
      --shadow-heavy: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--depth-900);
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
    }

    /* particle canvas — more subtle, deeper */
    #particleCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.3;
    }

    .app-shell {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* topbar — clean, minimal */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(14, 18, 27, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
      animation: sweep 5s ease-in-out infinite;
    }
    @keyframes sweep { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

    .hamburger {
      width: 44px; height: 44px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px;
      transition: 0.25s ease;
    }
    .hamburger:hover { border-color: var(--accent-primary); background: rgba(57,128,250,0.06); }
    .hamburger .bar {
      width: 22px; height: 2px;
      background: var(--accent-primary);
      border-radius: 2px;
      transition: 0.35s cubic-bezier(0.68, -0.6, 0.32, 1.6);
    }
    .hamburger.active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburger.active .bar:nth-child(2) { opacity: 0; }
    .hamburger.active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .topbar-brand {
      display: flex; align-items: center; gap: 8px;
    }
    .topbar-scorpion {
      font-size: 1.7rem;
      filter: drop-shadow(0 0 6px var(--accent-primary));
    }
    .topbar-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--text-primary);
    }
    .topbar-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 4px 12px;
      border: 1px solid var(--accent-tertiary);
      border-radius: 30px;
      color: var(--accent-primary);
      background: rgba(57,128,250,0.05);
    }

    .admin-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--accent-primary);
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s ease;
      margin-left: 8px;
    }
    .admin-btn:hover {
      border-color: var(--accent-primary);
      background: rgba(57,128,250,0.08);
      color: var(--text-primary);
    }

    /* drawer — deeper & sharp */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      opacity: 0; visibility: hidden;
      transition: 0.3s ease;
      backdrop-filter: blur(3px);
    }
    .drawer-overlay.open { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed; top: 0; left: 0;
      width: 320px; max-width: 85vw;
      height: 100vh;
      z-index: 300;
      background: linear-gradient(145deg, var(--depth-800), var(--depth-900));
      border-right: 1px solid var(--border-subtle);
      box-shadow: 15px 0 50px -20px black;
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 28px 20px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(57,128,250,0.08);
    }
    .drawer-logo {
      width: 80px; height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--depth-600), var(--accent-secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 0 0 3px rgba(57,128,250,0.15);
    }
    .drawer-channel-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text-primary);
    }
    .drawer-handle {
      font-size: 0.85rem;
      color: var(--accent-primary);
    }

    .drawer-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 20px;
      border-bottom: 1px solid rgba(57,128,250,0.06);
    }
    .stat-box {
      background: rgba(57,128,250,0.04);
      border: 1px solid rgba(57,128,250,0.08);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-box .stat-num {
      font-weight: 700; font-size: 1.4rem; color: var(--accent-primary); display: block;
    }
    .stat-box .stat-label {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary);
    }

    .drawer-nav {
      padding: 14px 16px; flex: 1;
    }
    .drawer-nav-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 12px;
      font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: 0.2s;
      width: 100%; background: none; border: none; text-align: left;
    }
    .drawer-nav-item i { width: 22px; color: var(--accent-primary); }
    .drawer-nav-item:hover { background: rgba(57,128,250,0.08); color: white; }
    .drawer-nav-item.active-nav { background: rgba(57,128,250,0.12); color: white; border-left: 3px solid var(--accent-primary); }

    .drawer-footer-info {
      padding: 20px; border-top: 1px solid rgba(57,128,250,0.06);
      text-align: center;
    }
    .drawer-tg-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
      color: white; font-weight: 600; font-size: 0.8rem;
      border-radius: 40px; text-decoration: none;
      box-shadow: 0 6px 18px rgba(57,128,250,0.2);
    }
    .drawer-tg-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(57,128,250,0.3); }

    /* hero */
    .hero {
      padding: 40px 24px 20px;
      text-align: center;
    }
    .hero-scorpion-icon {
      font-size: 3.8rem; display: block; margin-bottom: 8px;
      filter: drop-shadow(0 0 16px var(--accent-primary));
      animation: subtleDrift 4s infinite;
    }
    @keyframes subtleDrift { 0%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 2px;
      color: white;
      text-shadow: 0 2px 15px var(--glow-highlight);
    }
    .hero-sub {
      font-size: 0.9rem; letter-spacing: 3px; color: var(--accent-primary); text-transform: uppercase;
    }
    .hero-desc-card {
      max-width: 700px; margin: 24px auto 0;
      padding: 18px 26px; background: var(--glass-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle); border-radius: 28px;
      color: var(--text-secondary); font-size: 0.95rem;
    }

    /* search */
    .search-wrap { display: flex; justify-content: center; padding: 10px 20px 25px; }
    .search-container {
      position: relative; width: 100%; max-width: 560px;
    }
    .search-container i {
      position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
      color: var(--accent-primary); font-size: 1rem;
    }
    .search-container input {
      width: 100%; padding: 16px 22px 16px 48px;
      font-size: 0.95rem; background: var(--card-bg);
      border: 1.5px solid rgba(57,128,250,0.15); border-radius: 18px;
      color: var(--text-primary); outline: none;
    }
    .search-container input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(57,128,250,0.1); }

    /* tabs */
    .section-tabs {
      display: flex; justify-content: center; gap: 8px; padding: 0 20px 24px; flex-wrap: wrap;
    }
    .tab-btn {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.7rem;
      letter-spacing: 1.5px; padding: 10px 24px;
      border: 1px solid rgba(57,128,250,0.15); border-radius: 14px;
      background: transparent; color: var(--text-secondary); cursor: pointer;
    }
    .tab-btn:hover { border-color: var(--accent-primary); color: white; }
    .tab-btn.active-tab {
      background: rgba(57,128,250,0.1); border-color: var(--accent-primary); color: white;
    }

    /* mod grid */
    .mod-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
      padding: 0 20px 40px; max-width: 1000px; margin: 0 auto;
    }
    @media (max-width:640px){ .mod-grid{ grid-template-columns:1fr; } }
    .mod-card {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid rgba(57,128,250,0.08); border-radius: 26px;
      padding: 24px 22px 20px; transition: 0.25s ease;
      box-shadow: var(--shadow-heavy);
    }
    .mod-card:hover { transform: translateY(-4px); border-color: rgba(57,128,250,0.2); box-shadow: 0 25px 50px -12px black; }
    .mod-card-icon { font-size: 2rem; margin-bottom: 12px; filter: drop-shadow(0 0 6px var(--accent-primary)); }
    .mod-card h3 { font-weight: 700; font-size: 1rem; color: white; margin-bottom: 6px; }
    .mod-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; }
    .mod-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .mod-size-tag {
      font-size: 0.65rem; font-weight: 600; padding: 4px 10px; background: rgba(57,128,250,0.06);
      border: 1px solid rgba(57,128,250,0.1); border-radius: 8px; color: var(--accent-primary);
    }
    .mod-dl-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
      font-weight: 600; font-size: 0.7rem; text-decoration: none; color: white;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
      border-radius: 14px; transition: 0.2s; border: none; cursor: pointer;
    }
    .mod-dl-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(57,128,250,0.3); }

    /* status checker, info, admin unified */
    .checker-section, .info-section, .admin-panel { max-width: 1000px; margin: 0 auto 50px; padding: 0 20px; display: none; }
    .visible { display: block; }
    .checker-card, .admin-login-card, .admin-add-form { background: var(--card-bg); border: 1px solid rgba(57,128,250,0.08); border-radius: 32px; padding: 28px 26px; backdrop-filter: blur(10px); }

    .checker-title, .admin-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.2rem; color: white; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    .check-item {
      display: flex; align-items: center; gap: 16px; padding: 16px; background: rgba(57,128,250,0.02);
      border: 1px solid rgba(57,128,250,0.05); border-radius: 20px; margin-bottom: 8px;
    }
    .check-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .check-dot.online { background: var(--success); box-shadow: 0 0 12px var(--success); }
    .check-dot.offline { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
    .check-dot.warning { background: var(--warning); box-shadow: 0 0 12px var(--warning); }
    .check-status-text { font-weight: 600; font-size: 0.6rem; padding: 4px 12px; border-radius: 30px; }
    .status-live { background: rgba(16,185,129,0.1); color: var(--success); }
    .status-down { background: rgba(239,68,68,0.1); color: var(--danger); }
    .status-warn { background: rgba(245,158,11,0.1); color: var(--warning); }

    .info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; }
    .info-card { background: var(--card-bg); border: 1px solid rgba(57,128,250,0.08); border-radius: 28px; padding: 24px; }
    .info-card-title { font-weight: 700; color: var(--accent-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* admin panel refined */
    .admin-input-group { margin-bottom: 18px; }
    .admin-input-group input, .admin-form-row input, .admin-form-full input, .admin-form-full select {
      width: 100%; padding: 14px 18px; background: rgba(14,18,27,0.7); border: 1.5px solid rgba(57,128,250,0.15);
      border-radius: 16px; color: white; font-size: 0.95rem; outline: none;
    }
    .admin-input-group input:focus { border-color: var(--accent-primary); }
    .admin-btn-login, .admin-submit-btn {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary)); border: none;
      padding: 14px 28px; border-radius: 16px; font-weight: 600; color: white; cursor: pointer; transition: 0.2s;
    }
    .admin-btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(57,128,250,0.2); }
    .admin-dashboard { display: none; }
    .admin-dashboard.visible { display: block; }

    /* ICON UPLOAD — new mature file input */
    .icon-upload-area {
      margin: 16px 0;
    }
    .icon-upload-label {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      background: rgba(57,128,250,0.05); border: 1.5px dashed var(--accent-primary); border-radius: 20px;
      cursor: pointer; transition: 0.2s; color: var(--text-secondary);
    }
    .icon-upload-label i { font-size: 1.5rem; color: var(--accent-primary); }
    .icon-upload-label:hover { background: rgba(57,128,250,0.1); }
    #iconPreview { margin-top: 8px; font-size: 2rem; text-align: center; display: none; }
    #iconFileInput { display: none; }

    .admin-mod-item { display: flex; justify-content: space-between; align-items: center; background: rgba(57,128,250,0.02); border: 1px solid rgba(57,128,250,0.06); border-radius: 20px; padding: 16px; margin-top: 12px; }
    .admin-delete-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: var(--danger); padding: 8px 18px; border-radius: 14px; font-weight: 600; font-size: 0.7rem; cursor: pointer; }
    .admin-logout-btn { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); padding: 8px 18px; border-radius: 14px; }
    .footer { background: rgba(14,18,27,0.8); border-top: 1px solid var(--border-subtle); }
  </style>
</head>
